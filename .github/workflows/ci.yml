name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift (${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', latest-stable]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select Xcode
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          requested = os.environ['XCODE_VERSION']
          if requested == 'latest-stable':
              candidates = []
              for path in Path('/Applications').glob('Xcode_*.app'):
                  match = re.fullmatch(r'Xcode_(\d+(?:\.\d+)*)\.app', path.name)
                  if match:
                      candidates.append((tuple(map(int, match.group(1).split('.'))), path))
              if not candidates:
                  raise SystemExit('No stable Xcode found')
              xcode = max(candidates)[1]
          else:
              xcode = Path(f'/Applications/Xcode_{requested}.app')
          developer = xcode / 'Contents/Developer'
          if not developer.is_dir():
              raise SystemExit(f'Missing requested Xcode: {xcode}')
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'DEVELOPER_DIR={developer}\n')
          print(f'Selected {xcode}')
          PY
      - name: Verify compiler version
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          swift --version
          if [ "$XCODE_VERSION" = '16.2' ]; then
            swift --version | grep -E 'Swift version 6\.0([ .]|$)'
          fi
      - name: SDK unit and HTTP integration tests
        run: swift test -Xswiftc -warnings-as-errors
      - name: Example feature tests
        run: swift test --package-path Examples/SupportInbox/SupportInboxPackage -Xswiftc -warnings-as-errors
      - name: Compile documentation examples without executing requests
        run: python3 scripts/check-documentation-examples.py
      - name: Build every supported Apple platform at its minimum deployment target
        run: bash scripts/build-apple-platforms.sh
      - name: Thread Sanitizer
        if: matrix.xcode == 'latest-stable'
        run: swift test --sanitize=thread
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: matrix.xcode == 'latest-stable'
        with:
          node-version: '22'
      - name: Install simulator tooling
        if: matrix.xcode == 'latest-stable'
        run: npm install --global xcodebuildmcp@2.3.2
      - name: Build DocC documentation
        if: matrix.xcode == 'latest-stable'
        run: python3 scripts/build-documentation.py
      - name: SDK and sample tests on iOS Simulator
        if: matrix.xcode == 'latest-stable'
        run: python3 scripts/test-ios-simulator.py

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    name: iOS simulator tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
      - uses: ./.github/actions/setup-xcodebuildmcp
      - name: SDK and sample tests
        run: python3 scripts/test-ios-simulator.py

  documentation:
    name: Build DocC documentation
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
      - uses: ./.github/actions/setup-xcodebuildmcp
      - run: python3 scripts/build-documentation.py

  sdk-tests:
    name: SDK tests (${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', latest-stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
        with:
          version: ${{ matrix.xcode }}
      - name: Unit and HTTP integration tests
        run: swift test -Xswiftc -warnings-as-errors

  example-tests:
    name: Example tests (${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', latest-stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
        with:
          version: ${{ matrix.xcode }}
      - run: swift test --package-path Examples/SupportInbox/SupportInboxPackage -Xswiftc -warnings-as-errors

  documentation-examples:
    name: Compile DocC examples (${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', latest-stable]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
        with:
          version: ${{ matrix.xcode }}
      - run: python3 scripts/check-documentation-examples.py

  platform-build:
    name: Build ${{ matrix.platform }} (${{ matrix.xcode }})
    runs-on: macos-15
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        xcode: ['16.2', latest-stable]
        platform:
          - macos
          - macos-intel
          - ios
          - ios-simulator-arm64
          - ios-simulator-intel
          - catalyst
          - tvos
          - watchos
          - visionos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
        with:
          version: ${{ matrix.xcode }}
      - name: Build at the minimum deployment target
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/build-apple-platforms.sh "$PLATFORM"

  thread-sanitizer:
    name: Thread Sanitizer
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24
      - uses: ./.github/actions/setup-xcode
      - run: swift test --sanitize=thread
